[package]
name = "mewway"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.32"
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "client", "http1", "http2"] }
# 只为解 logo.ico 里的 PNG 帧。它本来就在依赖树里（tray-icon -> image -> png），
# 提成直接依赖不增加任何下载量或编译时间。
png = "0.18.1"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Networking_WinInet",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
winreg = "0.56.0"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
